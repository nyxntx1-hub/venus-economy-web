<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Economy - Panel de Control</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b1021; color: #e2e8f0; margin: 0; padding: 20px; }
.container { max-width: 980px; margin: 0 auto; }
h1 { color: #38bdf8; border-bottom: 2px solid #38bdf8; padding-bottom: 8px; margin-top: 0; }
.card { background: #16213e; border-radius: 10px; padding: 16px; margin: 14px 0; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.card h2 { color: #22d3ee; margin-top: 0; font-size: 1.05rem; border-bottom: 1px solid #2d3a59; padding-bottom: 6px; }
label { display: block; margin: 7px 0 3px; font-size: .85rem; color: #94a3b8; }
input, select { width: 100%; padding: 7px 9px; background: #0b1021; border: 1px solid #334155; border-radius: 6px; color: #f1f5f9; font-size: .9rem; margin-bottom: 9px; }
input:focus { outline: none; border-color: #38bdf8; }
button { background: #38bdf8; color: #0b1021; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; margin: 4px 4px 4px 0; }
button:hover { background: #7dd3fc; }
button.sec { background: #334155; color: #f1f5f9; }
button.sec:hover { background: #475569; }
button.add { background: #10b981; color: #fff; }
button.add:hover { background: #059669; }
button.del { background: #ef4444; color: #fff; font-size: .8rem; padding: 4px 8px; }
button.del:hover { background: #dc2626; }
button.save { background: #22c55e; color: #fff; font-size: 1.1rem; padding: 12px 28px; }
.status { margin: 8px 0; padding: 8px 12px; border-radius: 6px; font-size: .85rem; display: none; }
.status.ok { background: #064e3b; color: #86efac; border: 1px solid #10b981; display: block; }
.status.err { background: #450a0a; color: #fecaca; border: 1px solid #ef4444; display: block; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.col { flex: 1; min-width: 220px; }
.list { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.list input { flex: 1; margin: 0; }
.apirow { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.apirow input { flex: 1; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2d3a59; font-size: .85rem; }
th { color: #94a3b8; }
.pwd { display: flex; gap: 8px; align-items: center; }
.pwd input { flex: 1; margin: 0; }
.events { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .8rem; color: #94a3b8; max-height: 220px; overflow-y: auto; }
</style>
</head>
<body>

<div class="container">
  <h1>🌐 Venus Economy - Panel de Control</h1>

  <div class="card">
    <div class="apirow">
      <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec" value="https://script.google.com/macros/s/AKfycby6CKgYvO9TgpBcpqTG3ISiuTb6apoRLvCJSmW0oDf1Jk8OZTGaPQO6wH4P1zH5-y57/exec">
      <input type="password" id="adminPwd" placeholder="Contraseña" value="venus_admin_2026">
      <button class="sec" onclick="loadConfig()">Cargar desde la nube</button>
    </div>
    <div id="statusLoad" class="status"></div>
  </div>

  <div class="card">
    <h2>👑 Líderboard</h2>
    <label>Título</label><input type="text" id="lbTitle" value="👑 VIP LEADERBOARD 👑">
    <label>Actualizar cada (segundos, mínimo 5)</label><input type="number" id="lbRefresh" value="10" min="5">
    <div class="row">
      <div class="col">
        <label>Nombres de jugadores (VRChat displayName)</label>
        <div id="lbNames"></div>
        <button class="add" onclick="addItem('lbNames','lbNameIn')">+ Agregar nombre</button>
        <input type="text" id="lbNameIn" placeholder="Nombre..." style="display:none">
      </div>
      <div class="col">
        <label>Montos iniciales</label>
        <div id="lbAmts"></div>
        <button class="add" onclick="addItem('lbAmts','lbAmtIn')">+ Agregar monto</button>
        <input type="number" id="lbAmtIn" placeholder="0" style="display:none">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>💰 Economía</h2>
    <div class="row">
      <div class="col"><label>Saldo inicial</label><input type="number" id="ecStart" value="150"></div>
      <div class="col"><label>Reset cada (horas)</label><input type="number" id="ecReset" value="2" step="0.5"></div>
      <div class="col"><label>Máx. por transferencia</label><input type="number" id="ecMax" value="1000"></div>
      <div class="col"><label>Versión líderboard (sube para reiniciar ranks)</label><input type="number" id="ecVer" value="1"></div>
    </div>
  </div>

  <div class="card">
    <h2>🎁 Botón Regalo (Whitelist)</h2>
    <div class="row"><div class="col"><label>Monto del regalo</label><input type="number" id="giftAmt" value="500"></div></div>
    <label>Nombres autorizados</label>
    <div id="giftWl"></div>
    <button class="add" onclick="addItem('giftWl','giftWlIn')">+ Agregar a whitelist</button>
    <input type="text" id="giftWlIn" placeholder="Nombre VRChat..." style="display:none">
  </div>

  <div class="card">
    <h2>💸 Lanzador de Dinero (Permisos)</h2>
    <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="throwEveryone" checked> Permitir a todos lanzar dinero</label>
    <label>Whitelist de lanzadores</label>
    <div id="throwWl"></div>
    <button class="add" onclick="addItem('throwWl','throwWlIn')">+ Agregar lanzador</button>
    <input type="text" id="throwWlIn" placeholder="Nombre VRChat..." style="display:none">
  </div>

  <div class="card">
    <h2>💳 Opciones de Pago (Kiosko)</h2>
    <div id="payList"></div>
    <button class="add" onclick="addPayment()">+ Agregar opción de pago</button>
  </div>

  <div style="text-align:center;">
    <button class="save" onclick="saveConfig()">💾 Guardar todo en la nube</button>
    <button class="sec" onclick="loadEvents()">🔄 Ver eventos recientes</button>
  </div>
  <div id="statusSave" class="status"></div>

  <div class="card" style="margin-top:20px;">
    <h2>📊 Eventos del mundo</h2>
    <div id="eventsList" class="events">Cargando...</div>
  </div>
</div>

<script>
let API_URL = document.getElementById('apiUrl').value;
let PWD = document.getElementById('adminPwd').value;
document.getElementById('apiUrl').oninput = e => API_URL = e.target.value;
document.getElementById('adminPwd').oninput = e => PWD = e.target.value;

function show(id, msg, ok){
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
}

async function api(params){
  const qs = new URLSearchParams({pwd:PWD, ...params}).toString();
  const r = await fetch(API_URL + '?' + qs);
  return await r.json();
}

async function loadConfig(){
  show('statusLoad','Cargando...',true);
  try{
    const d = await api({action:'get_config'});
    if(!d.ok) throw new Error(d.error||'Error');
    document.getElementById('lbTitle').value = d.leaderboardTitle||'';
    document.getElementById('lbRefresh').value = d.refreshIntervalSeconds||'10';
    renderList('lbNames', d.trackedDisplayNames?d.trackedDisplayNames.split('|'):[]);
    renderList('lbAmts', d.initialAmounts?d.initialAmounts.split('|'):[]);
    document.getElementById('ecStart').value = d.startingBalance||'150';
    document.getElementById('ecReset').value = d.resetIntervalHours||'2';
    document.getElementById('ecMax').value = d.maxTransferAmount||'1000';
    document.getElementById('ecVer').value = d.leaderboardDataVersion||'1';
    document.getElementById('giftAmt').value = d.giftAmount||'500';
    renderList('giftWl', d.gift_wl?d.gift_wl.split('|'):[]);
    document.getElementById('throwEveryone').checked = d.throwerAllowEveryone!=='false';
    renderList('throwWl', d.throw_wl?d.throw_wl.split('|'):[]);
    renderPayments(d.pay_labels?d.pay_labels.split('|'):[], d.pay_recips?d.pay_recips.split('|'):[], d.pay_amts?d.pay_amts.split('|'):[]);
    loadEvents();
    show('statusLoad','✅ Config cargada',true);
  }catch(e){ show('statusLoad','❌ '+e.message,false); }
}

function renderList(id, items){
  const c = document.getElementById(id);
  c.innerHTML = '';
  items.forEach(v => {
    const div = document.createElement('div');
    div.className='list';
    div.innerHTML = `<input type="text" value="${esc(v)}"><button class="del" onclick="this.parentElement.remove()">×</button>`;
    c.appendChild(div);
  });
}

function addItem(listId, inputId){
  const c = document.getElementById(listId);
  const inp = document.getElementById(inputId);
  const v = inp.value.trim();
  if(!v) return;
  const div = document.createElement('div');
  div.className='list';
  div.innerHTML = `<input type="text" value="${esc(v)}"><button class="del" onclick="this.parentElement.remove()">×</button>`;
  c.appendChild(div);
  inp.value='';
}

function addPayment(){
  const c = document.getElementById('payList');
  const div = document.createElement('div');
  div.className='list';
  div.innerHTML = `<input type="text" placeholder="Etiqueta">
                   <input type="text" placeholder="Destinatario">
                   <input type="number" placeholder="Monto">
                   <button class="del" onclick="this.parentElement.remove()">×</button>`;
  c.appendChild(div);
}

function renderPayments(labels, recips, amts){
  const c = document.getElementById('payList');
  c.innerHTML='';
  const n = Math.max(labels.length, recips.length, amts.length);
  for(let i=0;i<n;i++){
    const div = document.createElement('div');
    div.className='list';
    div.innerHTML = `<input type="text" value="${esc(labels[i]||'')}"><input type="text" value="${esc(recips[i]||'')}"><input type="number" value="${esc(amts[i]||'')}"><button class="del" onclick="this.parentElement.remove()">×</button>`;
    c.appendChild(div);
  }
}

function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

function getList(id){
  const c = document.getElementById(id);
  const out=[];
  c.querySelectorAll('input').forEach(i=>{ const v=i.value.trim(); if(v) out.push(v); });
  return out.join('|');
}

function getPayments(){
  const c = document.getElementById('payList');
  const rows=[];
  c.querySelectorAll('.list').forEach(div=>{
    const ins = div.querySelectorAll('input');
    if(ins.length>=3 && ins[0].value.trim()) rows.push([ins[0].value.trim(), ins[1].value.trim(), ins[2].value||0]);
  });
  return rows;
}

async function saveConfig(){
  const rows = getPayments();
  const params = {
    action:'set_config',
    leaderboardTitle:document.getElementById('lbTitle').value,
    refreshIntervalSeconds:document.getElementById('lbRefresh').value,
    startingBalance:document.getElementById('ecStart').value,
    resetIntervalHours:document.getElementById('ecReset').value,
    maxTransferAmount:document.getElementById('ecMax').value,
    leaderboardDataVersion:document.getElementById('ecVer').value,
    giftAmount:document.getElementById('giftAmt').value,
    throwerAllowEveryone:document.getElementById('throwEveryone').checked,
    lb_names:getList('lbNames'),
    lb_amounts:getList('lbAmts'),
    gift_wl:getList('giftWl'),
    throw_wl:getList('throwWl'),
    pay_labels:rows.map(r=>r[0]).join('|'),
    pay_recips:rows.map(r=>r[1]).join('|'),
    pay_amts:rows.map(r=>r[2]).join('|')
  };
  show('statusSave','Guardando...',true);
  try{
    const d = await api(params);
    if(d.ok) show('statusSave','✅ Guardado. El mundo lo reflejará en el próximo ciclo (≤ 20s).',true);
    else show('statusSave','❌ '+ (d.error||'Error'),false);
  }catch(e){ show('statusSave','❌ '+e.message,false); }
}

async function loadEvents(){
  try{
    const d = await api({action:'get_events'});
    const el = document.getElementById('eventsList');
    if(!d || !Array.isArray(d)){ el.textContent='Sin eventos'; return; }
    const rec = d.slice(-10).reverse();
    el.innerHTML = rec.map(e=>`<div>${new Date(e.timestamp).toLocaleString()} | ${e.player||'-'} | ${e.action||'-'} | $${e.amount||0} | ${e.detail||''}</div>`).join('') || 'Sin eventos';
  }catch(e){ document.getElementById('eventsList').textContent='No se pudieron cargar eventos'; }
}

loadConfig();
setInterval(loadEvents, 30000);
</script>

</body>
</html>
</script>

</body>
</html>
